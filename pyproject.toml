[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts-data-extractor"
version = "0.1.0"
description = "Extract structured data from receipts (images/PDF) using OCR and parsing heuristics/ML."
authors = [{name = "You", email = "you@example.com"}]
requires-python = ">=3.8"

[project.scripts]
rde = "receipts_data_extractor.cli:main"
